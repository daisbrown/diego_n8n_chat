# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-itinnovat-snowagent

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: servicenowapp.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_4D40C4C62F6D4DEF93B76C27A8C0C7B9 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_818C412C1AB5422980B92C7266BCBC72 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: servicenowapp.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_4D40C4C62F6D4DEF93B76C27A8C0C7B9 }}/chatbot/diego:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    

    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3F8B1BF64DE548A89173DEF0FD78A4C2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3908450EF2594440BE4877DC443652C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8C01F455E9594B98B1E477BCE89D2CEF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-itinnovat-snowagent'
          slot-name: 'Production'
          images: 'servicenowapp.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_4D40C4C62F6D4DEF93B76C27A8C0C7B9 }}/chatbot/diego:${{ github.sha }}'
          